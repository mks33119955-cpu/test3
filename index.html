<form id="lead-form">
  <div class="form-grid">
    <div class="field">
      <label for="company">Компания *</label>
      <input id="company" name="company" type="text" required>
    </div>
    <div class="field">
      <label for="name">Контактное лицо *</label>
      <input id="name" name="name" type="text" required>
    </div>
    <div class="field">
      <label for="phone">Телефон *</label>
      <input id="phone" name="phone" type="tel" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email">
    </div>
    <div class="field full">
      <label for="route">Маршрут</label>
      <input id="route" name="route" type="text" placeholder="Например: Москва → Новосибирск">
    </div>
    <div class="field">
      <label for="weight">Вес, кг</label>
      <input id="weight" name="weight" type="text">
    </div>
    <div class="field">
      <label for="volume">Объём, м³</label>
      <input id="volume" name="volume" type="text">
    </div>
    <div class="field full">
      <label for="comment">Комментарий</label>
      <textarea id="comment" name="comment" rows="3"></textarea>
    </div>
    <label class="checkbox">
      <input type="checkbox" name="consent" required>
      <span>Согласен на обработку персональных данных.</span>
    </label>
    <button class="btn dark" type="submit" id="submit-btn">Отправить заявку →</button>
    <p id="form-status" class="form-note" style="display:none"></p>
  </div>
</form>
